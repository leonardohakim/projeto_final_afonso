name: Northwind ETL CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install clickhouse-connect psycopg2-binary pandas tenacity pytest pytest-mock

    - name: Set up Docker services
      run: |
        docker-compose up -d clickhouse postgres
        # Wait for databases to be healthy before proceeding
        sleep 20

    - name: Initialize Databases
      run: |
        python scripts/db_setup.py

    - name: Run Tests
      run: |
        pytest tests/ -v
